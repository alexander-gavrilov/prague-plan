    // Render cards
    function renderCards() {
      const day1Container = document.getElementById('day1-cards');
      const day2Container = document.getElementById('day2-cards');
      const day3Container = document.getElementById('day3-cards');

      day1Container.innerHTML = day1Cards.map(card => 
        createCard(card.title, card.description, planData[card.key])
      ).join('');

      day2Container.innerHTML = day2Cards.map(card => 
        createCard(card.title, card.description, planData[card.key])
      ).join('');

      day3Container.innerHTML = day3Cards.map(card => 
        createCard(card.title, card.description, planData[card.key])
      ).join('');
    }

    // Tab switching function
    function showTab(tabNumber) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Remove active class from all buttons
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Show selected tab
      document.getElementById(`tab${tabNumber}-content`).classList.add('active');
      
      // Add active class to selected button
      document.getElementById(`tab${tabNumber}-btn`).classList.add('active');
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      renderCards();
      showTab(1); // Default to first tab
    });
  </script>
